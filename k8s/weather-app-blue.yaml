apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-blue
  labels:
    app: weather-app
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-app
      version: blue
  template:
    metadata:
      labels:
        app: weather-app
        version: blue
    spec:
      containers:
      - name: weather-app
        image: weather-app:blue
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: OPENWEATHER_API_KEY
          value: "227d8cad97e4ee6dd58fdcdb0c5cd7a8"
---
apiVersion: v1
kind: Service
metadata:
  name: weather-app-blue-service
spec:
  selector:
    app: weather-app
    version: blue
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
